<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주차장 실시간 현황판</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 1. 기본 레이아웃 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }

        /* 2. 헤더 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px; /* 게이트 공간 확보를 위해 여백 늘림 */
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .header h1 { margin: 0; font-size: 22px; color: #2c3e50; }
        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            margin-left: 15px;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .nav-links a:hover { background-color: #f0f0f0; color: #000; }

        /* === [NEW] 3. 리얼한 게이트 UI === */
        .gate-section {
            display: flex;
            justify-content: center;
            gap: 150px; /* 게이트 사이 간격 */
            margin-bottom: 50px;
            position: relative;
        }

        .gate-wrapper {
            position: relative;
            width: 200px;
            height: 120px;
            display: flex;
            align-items: flex-end;
        }

        /* 게이트 기둥 (Pillar) */
        .gate-pillar {
            width: 50px;
            height: 90px;
            background: linear-gradient(135deg, #34495e, #2c3e50);
            border-radius: 8px 8px 0 0;
            position: absolute;
            left: 0;
            bottom: 0;
            z-index: 10;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 10px 0;
        }

        /* 상태 LED 표시등 */
        .status-light {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #c0392b; /* 기본 Red */
            box-shadow: 0 0 10px #c0392b;
            transition: 0.3s;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .status-light.active {
            background-color: #2ecc71; /* Open 시 Green */
            box-shadow: 0 0 15px #2ecc71;
        }

        /* 차단봉 (Arm) */
        .gate-arm {
            width: 180px;
            height: 16px;
            /* 빨강/흰색 사선 스트라이프 패턴 */
            background: repeating-linear-gradient(
                45deg,
                #e74c3c,
                #e74c3c 15px,
                #f1f2f6 15px,
                #f1f2f6 30px
            );
            position: absolute;
            left: 25px; /* 기둥 중앙 */
            bottom: 60px; /* 기둥 상단부 회전축 */
            transform-origin: 0% 50%; /* 왼쪽 끝을 기준으로 회전 */
            transform: rotate(0deg); /* 닫힘 상태 */
            transition: transform 0.6s cubic-bezier(0.4, 2.5, 0.55, 0.8); /* 튕기는 효과 */
            border-radius: 0 5px 5px 0;
            box-shadow: 0 5px 5px rgba(0,0,0,0.1);
            z-index: 5; /* 기둥 뒤로 숨기거나 앞으로 빼거나 */
        }
        
        /* 열림 상태 클래스 */
        .gate-arm.open {
            transform: rotate(-65deg); /* 위로 올라감 */
        }

        /* 라벨 (입차 게이트) */
        .gate-label-text {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            color: #555;
            font-size: 16px;
            white-space: nowrap;
        }

        /* 4. 범례 */
        .legend-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: #555; }
        .legend-box { width: 15px; height: 20px; margin-right: 8px; border: 1px solid #ccc; }
        
        .bg-shared { background-color: #2ecc71; border-color: #27ae60; }
        .bg-reserved { background-color: #f1c40f; border-color: #f39c12; }
        .bg-external { background-color: #3498db; border-color: #2980b9; }
        .bg-occupied { background-color: #34495e; border-color: #2c3e50; }
        .bg-unassigned { background-color: transparent; border-color: #bdc3c7; }
        .bg-closed { background-color: #e74c3c; border-color: #c0392b; }

        /* 5. 메인 맵 컨테이너 */
        .map-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 6. 구역 박스 */
        .zone-box {
            background-color: #4a5568;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            border: 4px solid #2d3748;
        }
        .zone-box.closed-zone {
            border-color: #e74c3c;
            opacity: 0.8;
        }
        .zone-label {
            position: absolute;
            top: -15px;
            left: 20px;
            background: #2d3748;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 7. 주차 그리드 */
        .parking-lot {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px 8px;
        }

        .parking-space {
            height: 110px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s;
        }

        .parking-space:nth-child(-n+5) {
            border-top: none;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 0 0 5px 5px;
        }

        .parking-space:nth-child(n+6) {
            border-bottom: none;
            border-top: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 5px 5px 0 0;
        }

        .space-num {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .parking-space.status-shared { background-color: rgba(46, 204, 113, 0.2); border-color: #2ecc71; }
        .parking-space.status-reserved { background-color: rgba(241, 196, 15, 0.2); border-color: #f1c40f; }
        
        .parking-space.has-car {
            border-style: solid;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        
        .parking-space.status-external { background-color: #3498db; border-color: #2980b9; }
        .parking-space.status-occupied { background-color: #34495e; border-color: #2c3e50; border: 2px solid #fff; }
        .parking-space.status-closed { 
            background: repeating-linear-gradient(45deg, #c0392b, #c0392b 10px, #e74c3c 10px, #e74c3c 20px);
            opacity: 0.6;
        }

        .car-icon {
            font-size: 32px;
            display: none;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .parking-space.has-car .car-icon { display: block; }

    </style>
</head>
<body>

    <div class="header">
        <h1>🅿️ 아파트 통합 주차 관제 시스템</h1>
        <div class="nav-links" id="authLinks">
            <a href="/login">로그인</a>
            <a href="/register">회원가입</a>
        </div>
    </div>

    <div class="gate-section">
        <div class="gate-wrapper">
            <div class="gate-pillar">
                <div class="status-light" id="light-1"></div>
            </div>
            <div class="gate-arm" id="arm-1"></div>
            <div class="gate-label-text">입차 게이트 (Entry)</div>
        </div>

        <div class="gate-wrapper">
            <div class="gate-pillar">
                <div class="status-light" id="light-2"></div>
            </div>
            <div class="gate-arm" id="arm-2"></div>
            <div class="gate-label-text">출차 게이트 (Exit)</div>
        </div>
    </div>

    <div class="legend-bar">
        <div class="legend-item"><div class="legend-box bg-shared"></div>공유중 (예약가능)</div>
        <div class="legend-item"><div class="legend-box bg-reserved"></div>예약됨</div>
        <div class="legend-item"><div class="legend-box bg-external"></div>외부차량</div>
        <div class="legend-item"><div class="legend-box bg-occupied"></div>입주민</div>
        <div class="legend-item"><div class="legend-box bg-unassigned"></div>빈 공간</div>
        <div class="legend-item"><div class="legend-box bg-closed"></div>폐쇄</div>
    </div>

    <div class="map-container" id="mapContainer">
        <p style="text-align:center; width:100%; color:#888;">시스템 데이터 로딩 중...</p>
    </div>

    <script>
        const vehicleId = sessionStorage.getItem('vehicleId');
        const role = sessionStorage.getItem('role');
        const authLinks = document.getElementById('authLinks');

        if (vehicleId) {
            let dashboardLink = '/visitor';
            if (role === 'Resident') dashboardLink = '/resident';
            if (role === 'Admin') dashboardLink = '/admin';

            authLinks.innerHTML = `
                <span style="margin-right:10px; color:#555;">👋 ${vehicleId}</span>
                <a href="${dashboardLink}" style="background:#3498db; color:white;">내 대시보드</a>
                <a href="#" onclick="logout()">로그아웃</a>
            `;
        }

        function logout() {
            sessionStorage.clear();
            window.location.reload();
        }

        async function fetchParkingStatus() {
            try {
                const response = await fetch('/parking-status');
                const data = await response.json();
                renderMap(data);
            } catch (error) { console.error(error); }
        }

        function renderMap(zonesData) {
            const container = document.getElementById('mapContainer');
            container.innerHTML = '';

            const sortedKeys = Object.keys(zonesData).sort();

            sortedKeys.forEach(zoneName => {
                const spaces = zonesData[zoneName];
                
                const zoneBox = document.createElement('div');
                zoneBox.className = 'zone-box';
                
                // 구역 자체가 폐쇄된 경우 시각적 처리
                if (spaces.length > 0 && spaces[0].op_status === 'closed') {
                    zoneBox.classList.add('closed-zone');
                }

                const label = document.createElement('div');
                label.className = 'zone-label';
                label.innerText = zoneName;
                zoneBox.appendChild(label);

                const grid = document.createElement('div');
                grid.className = 'parking-lot';

                spaces.forEach(space => {
                    const cell = document.createElement('div');
                    
                    // 1. 배경색 클래스 적용 (op_status 기준)
                    // 예: status-shared (녹색), status-occupied (남색)
                    cell.className = `parking-space status-${space.op_status}`;
                    
                    // 2. 차량 아이콘 표시 (is_occupied 기준)
                    if (space.is_occupied) {
                        cell.classList.add('has-car');
                    }

                    // 3. 아이콘 종류 결정
                    let icon = '';
                    if (space.is_occupied) {
                        // 외부인이면 파란차, 그 외(입주민)면 빨간차
                        if (space.op_status === 'external') {
                            icon = '🚙'; // 외부 차량
                        } else {
                            icon = '🚗'; // 입주민 차량 (shared 상태여도 입주민이 대고 있으면 이 아이콘)
                        }
                    } else if (space.op_status === 'reserved') {
                        icon = '🅿️'; // 예약됨 (차는 없지만 예약 표시)
                    }

                    cell.innerHTML = `
                        <div class="space-num">${space.num}</div>
                        <div class="car-icon">${icon}</div>
                    `;
                    
                    grid.appendChild(cell);
                });

                zoneBox.appendChild(grid);
                container.appendChild(zoneBox);
            });
        }

           

        // Socket.IO 게이트 제어
        const socket = io();
        socket.on('gate_status_changed', (data) => {
            updateGateUI(data.gate_id, data.status);
            
            // [수정] '자동 닫힘' 신호(auto_close)가 True일 때만 타이머 작동
            if (data.status === 'Open' && data.auto_close === true) {
                setTimeout(() => { 
                    updateGateUI(data.gate_id, 'Closed'); 
                }, 5000); // 5초 뒤 닫힘
            }
            // auto_close가 False(관리자 강제 개방)면 타이머 안 돌고 계속 열려있음
        });

        function updateGateUI(gateId, status) {
            const armId = `arm-${gateId}`;
            const lightId = `light-${gateId}`;
            
            const arm = document.getElementById(armId);
            const light = document.getElementById(lightId);

            if (status === 'Open') {
                arm.classList.add('open');      // 막대기 올라감
                light.classList.add('active');  // 초록불 켜짐
            } else {
                arm.classList.remove('open');   // 막대기 내려감
                light.classList.remove('active'); // 빨간불 켜짐
            }
        }

        fetchParkingStatus();
        setInterval(fetchParkingStatus, 3000);
    </script>
</body>
</html>
