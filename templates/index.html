<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주차장 실시간 현황판</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 1. 기본 레이아웃 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* 2. 헤더 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .header h1 { margin: 0; font-size: 22px; color: #2c3e50; }
        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            margin-left: 15px;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .nav-links a:hover { background-color: #f0f0f0; color: #000; }

        /* 3. 범례 */
        .legend-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; font-size: 13px; color: #555; }
        .legend-box { width: 15px; height: 20px; margin-right: 8px; border: 1px solid #ccc; }
        
        .bg-shared { background-color: #2ecc71; border-color: #27ae60; }
        .bg-reserved { background-color: #f1c40f; border-color: #f39c12; }
        .bg-external { background-color: #3498db; border-color: #2980b9; }
        .bg-occupied { background-color: #34495e; border-color: #2c3e50; }
        .bg-unassigned { background-color: transparent; border-color: #bdc3c7; }
        .bg-closed { background-color: #e74c3c; border-color: #c0392b; }

        /* 4. 메인 맵 컨테이너 */
        .map-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 5. 구역 박스 (아스팔트) */
        .zone-box {
            background-color: #4a5568;
            padding: 30px 20px; /* 위아래 패딩을 좀 더 줌 */
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            border: 4px solid #2d3748;
        }
        .zone-box.closed-zone {
            border-color: #e74c3c;
            opacity: 0.8;
        }
        .zone-label {
            position: absolute;
            top: -15px;
            left: 20px;
            background: #2d3748;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 6. 주차 그리드 (수정됨: 중앙 분리대 느낌) */
        .parking-lot {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5열 */
            gap: 4px 8px; /* 세로 간격(중앙선) 4px, 가로 간격 8px */
        }

        /* 7. 개별 주차 공간 (공통) */
        .parking-space {
            height: 110px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s;
        }

        /* === [핵심 수정] 윗줄과 아랫줄 스타일 분리 === */
        
        /* 1~5번 (윗줄): 위가 뚫림 (기존) */
        .parking-space:nth-child(-n+5) {
            border-top: none; /* 위쪽 개방 */
            border-bottom: 2px dashed rgba(255, 255, 255, 0.4); /* 아래쪽 막힘 (중앙) */
            border-radius: 0 0 5px 5px;
        }

        /* 6~10번 (아랫줄): 아래가 뚫림 (요청 사항) */
        .parking-space:nth-child(n+6) {
            border-bottom: none; /* 아래쪽 개방 */
            border-top: 2px dashed rgba(255, 255, 255, 0.4); /* 위쪽 막힘 (중앙) */
            border-radius: 5px 5px 0 0;
        }

        /* 내용물 스타일 */
        .space-num {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .parking-space.status-shared { background-color: rgba(46, 204, 113, 0.2); border-color: #2ecc71; }
        .parking-space.status-reserved { background-color: rgba(241, 196, 15, 0.2); border-color: #f1c40f; }
        
        .parking-space.has-car {
            border-style: solid;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3); /* 안으로 들어간 느낌 */
        }
        
        .parking-space.status-external { background-color: #3498db; border-color: #2980b9; }
        .parking-space.status-occupied { background-color: #34495e; border-color: #2c3e50; border: 2px solid #fff; }
        .parking-space.status-closed { 
            background: repeating-linear-gradient(45deg, #c0392b, #c0392b 10px, #e74c3c 10px, #e74c3c 20px);
            opacity: 0.6;
        }

        .car-icon {
            font-size: 32px;
            display: none;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        
        /* 아랫줄 차는 위를 보게 회전 (선택사항 - 원하시면 주석 해제) */
        /* .parking-space:nth-child(n+6) .car-icon { transform: rotate(180deg); } */

        .parking-space.has-car .car-icon { display: block; }

        /* 8. 게이트 */
        .gate-panel {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 60px;
        }
        .gate-box {
            background: white;
            padding: 15px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 120px;
            border-top: 5px solid #bdc3c7;
            transition: 0.3s;
        }
        .gate-box.open { border-color: #2ecc71; transform: translateY(-5px); }
        .gate-status { font-weight: bold; color: #bdc3c7; font-size: 18px; display: block; margin-top: 5px; }
        .gate-box.open .gate-status { color: #2ecc71; }

    </style>
</head>
<body>

    <div class="header">
        <h1>🅿️ 아파트 통합 주차 관제 시스템</h1>
        <div class="nav-links" id="authLinks">
            <a href="/login">로그인</a>
            <a href="/register">회원가입</a>
        </div>
    </div>

    <div class="legend-bar">
        <div class="legend-item"><div class="legend-box bg-shared"></div>공유중 (예약가능)</div>
        <div class="legend-item"><div class="legend-box bg-reserved"></div>예약됨</div>
        <div class="legend-item"><div class="legend-box bg-external"></div>외부차량</div>
        <div class="legend-item"><div class="legend-box bg-occupied"></div>입주민</div>
        <div class="legend-item"><div class="legend-box bg-unassigned"></div>빈 공간</div>
        <div class="legend-item"><div class="legend-box bg-closed"></div>폐쇄</div>
    </div>

    <div class="map-container" id="mapContainer">
        <p style="text-align:center; width:100%; color:#888;">시스템 데이터 로딩 중...</p>
    </div>

    <div class="gate-panel">
        <div class="gate-box" id="gate-1">
            <span>정문 (Entry)</span>
            <span class="gate-status" id="status-1">CLOSED</span>
        </div>
        <div class="gate-box" id="gate-2">
            <span>후문 (Exit)</span>
            <span class="gate-status" id="status-2">CLOSED</span>
        </div>
    </div>

    <script>
        const vehicleId = sessionStorage.getItem('vehicleId');
        const role = sessionStorage.getItem('role');
        const authLinks = document.getElementById('authLinks');

        if (vehicleId) {
            let dashboardLink = '/visitor';
            if (role === 'Resident') dashboardLink = '/resident';
            if (role === 'Admin') dashboardLink = '/admin';

            authLinks.innerHTML = `
                <span style="margin-right:10px; color:#555;">👋 ${vehicleId}</span>
                <a href="${dashboardLink}" style="background:#3498db; color:white;">내 대시보드</a>
                <a href="#" onclick="logout()">로그아웃</a>
            `;
        }

        function logout() {
            sessionStorage.clear();
            window.location.reload();
        }

        async function fetchParkingStatus() {
            try {
                const response = await fetch('/parking-status');
                const data = await response.json();
                renderMap(data);
            } catch (error) { console.error(error); }
        }

        function renderMap(zonesData) {
            const container = document.getElementById('mapContainer');
            container.innerHTML = '';

            const sortedKeys = Object.keys(zonesData).sort();

            sortedKeys.forEach(zoneName => {
                const spaces = zonesData[zoneName];
                
                const zoneBox = document.createElement('div');
                zoneBox.className = 'zone-box';
                
                if (spaces.length > 0 && spaces[0].status === 'closed') {
                    zoneBox.classList.add('closed-zone');
                }

                const label = document.createElement('div');
                label.className = 'zone-label';
                label.innerText = zoneName;
                zoneBox.appendChild(label);

                const grid = document.createElement('div');
                grid.className = 'parking-lot';

                spaces.forEach(space => {
                    const cell = document.createElement('div');
                    cell.className = `parking-space status-${space.status}`;
                    
                    if (['external', 'occupied', 'reserved'].includes(space.status)) {
                        cell.classList.add('has-car');
                    }

                    let icon = '';
                    if (space.status === 'external') icon = '🚙';
                    else if (space.status === 'occupied') icon = '🚗';
                    else if (space.status === 'reserved') icon = '🅿️';

                    cell.innerHTML = `
                        <div class="space-num">${space.num}</div>
                        <div class="car-icon">${icon}</div>
                    `;
                    grid.appendChild(cell);
                });

                zoneBox.appendChild(grid);
                container.appendChild(zoneBox);
            });
        }

        const socket = io();
        socket.on('gate_status_changed', (data) => {
            updateGateUI(data.gate_id, data.status);
            if (data.status === 'Open') {
                setTimeout(() => { updateGateUI(data.gate_id, 'Closed'); }, 5000);
            }
        });

        function updateGateUI(gateId, status) {
            const boxId = `gate-${gateId}`;
            const textId = `status-${gateId}`;
            const box = document.getElementById(boxId);
            const text = document.getElementById(textId);

            if (status === 'Open') {
                box.classList.add('open');
                text.innerText = 'OPEN !!!';
            } else {
                box.classList.remove('open');
                text.innerText = 'CLOSED';
            }
        }

        fetchParkingStatus();
        setInterval(fetchParkingStatus, 3000);
    </script>
</body>
</html>
