<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - 주차장 관리 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 공통 스타일 */
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #2c3e50; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* 헤더 */
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 20px; color: #2c3e50; }
        .admin-badge { background-color: #e74c3c; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; margin-left: 10px; }
        button.logout { background-color: #7f8c8d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        /* 레이아웃 그리드 */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        
        /* 카드 공통 */
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-header { font-size: 16px; font-weight: bold; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        /* 1. 승인 대기 패널 */
        .pending-box { border-left: 5px solid #e67e22; }
        .request-item { background-color: #fdf2e9; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .req-info { font-size: 14px; }
        .req-time { color: #e67e22; font-weight: bold; }
        .btn-approve { background-color: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-approve:hover { background-color: #27ae60; }

        /* 2. 구역 제어 패널 */
        .zone-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .zone-toggle { padding: 15px; border: 1px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
        .zone-toggle.active { background-color: #e8f8f5; border-color: #2ecc71; color: #27ae60; }
        .zone-toggle.closed { background-color: #fadbd8; border-color: #e74c3c; color: #c0392b; }
        .zone-name { font-weight: bold; font-size: 18px; display: block; }
        .zone-status { font-size: 12px; }

        /* 3. 게이트 제어 패널 */
        .gate-controls { display: flex; gap: 10px; }
        .btn-force-open { flex: 1; padding: 15px; background-color: #34495e; color: white; border: none; border-radius: 5px; cursor: pointer; text-align: center; }
        .btn-force-open:hover { background-color: #2c3e50; }
        .btn-force-open i { display: block; font-size: 20px; margin-bottom: 5px; }

        /* 4. 로그 테이블 */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #666; }
        .log-entry { color: #27ae60; }
        .log-exit { color: #e67e22; }

        /* [추가] 테이블 헤더 정렬 스타일 */
        th { 
            cursor: pointer; 
            position: relative;
        }
        th:hover {
            background-color: #e9ecef;
        }
        th::after {
            content: "↕"; /* 정렬 가능 표시 */
            font-size: 10px;
            margin-left: 5px;
            color: #aaa;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>🛡️ 통합 관제 센터 <span class="admin-badge">ADMIN</span></h1>
            </div>
            <div>
                <a href="/" style="text-decoration: none; color: #3498db; margin-right: 15px; font-size: 14px;">실시간 현황판 보기</a>
                <button class="logout" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card pending-box">
                <div class="card-header">
                    🚨 입차 승인 대기 (Pending Requests)
                    <button onclick="loadPendingRequests()" style="font-size:12px;">새로고침</button>
                </div>
                <div id="pendingList">
                    <div style="text-align:center; color:#999; padding:20px;">대기 중인 요청이 없습니다.</div>
                </div>
            </div>

            <!-- [신규] 블랙리스트 관리 패널 -->
            <div class="card" style="border-left: 5px solid #c0392b;">
                <div class="card-header">
                    🚫 블랙리스트 관리
                    <div>
                        <select id="blacklistFilter" onchange="loadBlacklistRequests()" style="font-size:12px; padding:3px;">
                            <option value="Pending">신청 대기</option>
                            <option value="Approved">차단 중 (목록)</option>
                        </select>
                        <button onclick="loadBlacklistRequests()" style="font-size:12px;">새로고침</button>
                    </div>
                </div>
                <div id="blacklistRequestList">
                    <div style="text-align:center; color:#999; padding:20px;">내역이 없습니다.</div>
                </div>
            </div>

            <div>
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">🚧 구역 폐쇄/해제 통제</div>
                    <div class="zone-controls" id="zoneList">
                        <p>구역 정보 로딩중...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                📋 통합 로그 (최근 20건)
                <div>
                    <select id="logType" onchange="loadLogs()">
                        <option value="gate">입출차 로그 (GateLog)</option>
                        <option value="reservation">예약 이력 (Reservation)</option>
                    </select>
                </div>
            </div>
            <table id="logTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const vehicleId = sessionStorage.getItem('vehicleId');
        const role = sessionStorage.getItem('role');

        if (!vehicleId || role !== 'Admin') {
            alert('관리자 권한이 필요합니다.');
            window.location.href = '/login';
        }

        const socket = io();

        // [핵심 추가] 시차 변환 없이(UTC 숫자 그대로) 보여주는 함수
        function formatTimeRaw(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            
            const year = date.getUTCFullYear();
            const month = String(date.getUTCMonth() + 1).padStart(2, '0');
            const day = String(date.getUTCDate()).padStart(2, '0');
            const hour = String(date.getUTCHours()).padStart(2, '0');
            const min = String(date.getUTCMinutes()).padStart(2, '0');
            
            return `${year}-${month}-${day} ${hour}:${min}`;
        }

        loadPendingRequests();
        loadZones();
        loadLogs();
        loadBlacklistRequests(); // [추가]

        setInterval(() => {
            loadPendingRequests();
            loadBlacklistRequests(); // [추가]
        }, 3000);

        // 1. 승인 대기
        async function loadPendingRequests() {
            try {
                const response = await fetch('/admin/pending-requests');
                const data = await response.json();
                const listDiv = document.getElementById('pendingList');

                if (data.requests.length === 0) {
                    listDiv.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">대기 중인 요청이 없습니다.</div>';
                    return;
                }

                listDiv.innerHTML = '';
                data.requests.forEach(req => {
                    // 시간 포맷 적용
                    const displayTime = formatTimeRaw(req.timestamp);
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    div.innerHTML = `
                        <div class="req-info">
                            <span class="req-time">[${displayTime}]</span><br>
                            차량번호: <strong>${req.vehicleid}</strong> (Gate ${req.gateid})
                        </div>
                        <button class="btn-approve" onclick="approveRequest(${req.logid})">승인 (문 열기)</button>
                    `;
                    listDiv.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        // [신규] 블랙리스트 목록 로드
        async function loadBlacklistRequests() {
            const filter = document.getElementById('blacklistFilter').value; // Pending or Approved
            const listDiv = document.getElementById('blacklistRequestList');
            
            try {
                let url = '/admin/blacklist-requests'; // 기본: 대기 목록
                if (filter === 'Approved') url = '/admin/blacklist/approved'; // 차단 목록

                const response = await fetch(url);
                const data = await response.json();

                if (!data.requests || data.requests.length === 0) {
                    listDiv.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">내역이 없습니다.</div>';
                    return;
                }

                listDiv.innerHTML = '';
                data.requests.forEach(req => {
                    const displayTime = formatTimeRaw(req.createdat);
                    const processedTime = req.processedat ? formatTimeRaw(req.processedat) : '-';
                    
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    
                    let buttonsHtml = '';
                    if (filter === 'Pending') {
                        buttonsHtml = `
                            <button onclick="approveBlacklist(${req.requestid})" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; margin-right:5px;">차단 승인</button>
                            <button onclick="rejectBlacklist(${req.requestid})" style="background:#95a5a6; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">반려</button>
                        `;
                    } else {
                        buttonsHtml = `
                            <button onclick="deleteBlacklist(${req.requestid})" style="background:#3498db; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">차단 해제</button>
                        `;
                    }

                    div.innerHTML = `
                        <div class="req-info" style="width:100%;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                                <span class="req-time">[신청: ${displayTime}]</span>
                                <span style="font-size:12px; color:#7f8c8d;">From: ${req.requestervehicleid}</span>
                            </div>
                            <div>대상: <strong>${req.targetvehicleid}</strong></div>
                            <div style="font-size:13px; color:#c0392b; margin:5px 0;">사유: ${req.reason}</div>
                            ${filter === 'Approved' ? `<div style="font-size:11px; color:#aaa;">처리일: ${processedTime}</div>` : ''}
                            <div style="text-align:right; margin-top:10px;">
                                ${buttonsHtml}
                            </div>
                        </div>
                    `;
                    listDiv.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        async function deleteBlacklist(reqId) {
            if(!confirm('정말로 차단을 해제하시겠습니까?')) return;
            try {
                const response = await fetch(`/admin/blacklist/${reqId}`, { method: 'DELETE' });
                const data = await response.json();
                alert(data.message || data.error);
                loadBlacklistRequests();
            } catch(e) { alert('오류'); }
        }

        async function approveBlacklist(reqId) {
            if(!confirm('해당 차량을 영구 차단하시겠습니까?\n(기존 예약은 모두 취소됩니다)')) return;
            try {
                const response = await fetch('/admin/blacklist/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ RequestID: reqId })
                });
                const data = await response.json();
                
                if (response.ok) {
                    alert(data.message);
                    loadBlacklistRequests();
                } else {
                    // [디버깅] 상세 에러 메시지 출력
                    alert(`오류: ${data.error}\n상세: ${data.details || ''}`);
                }
            } catch(e) { alert('통신 오류'); }
        }

        async function rejectBlacklist(reqId) {
            if(!confirm('신고를 반려하시겠습니까?')) return;
            try {
                const response = await fetch('/admin/blacklist/reject', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ RequestID: reqId })
                });
                const data = await response.json();
                alert(data.message || data.error);
                loadBlacklistRequests();
            } catch(e) { alert('오류'); }
        }

        async function approveRequest(logId) {
            if(!confirm('해당 차량의 입차를 승인하시겠습니까?')) return;
            try {
                const response = await fetch('/approve-entry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ LogID: logId })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(`승인 완료!`);
                    loadPendingRequests();
                } else {
                    alert(data.error);
                }
            } catch (e) { alert('오류 발생'); }
        }

        // 2. 구역
        async function loadZones() {
            try {
                const response = await fetch('/zones');
                const data = await response.json();
                const container = document.getElementById('zoneList');
                container.innerHTML = '';

                data.zones.forEach(zone => {
                    const div = document.createElement('div');
                    const isClosed = zone.status === 'Closed';
                    div.className = `zone-toggle ${isClosed ? 'closed' : 'active'}`;
                    div.onclick = () => toggleZoneStatus(zone.zoneid, zone.status);
                    
                    div.innerHTML = `
                        <span class="zone-name">${zone.zonename}</span>
                        <span class="zone-status">${isClosed ? '⛔ 폐쇄됨 (클릭하여 해제)' : '🟢 운영중 (클릭하여 폐쇄)'}</span>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        async function toggleZoneStatus(zoneId, currentStatus) {
            const newStatus = currentStatus === 'Available' ? 'Closed' : 'Available';
            const actionName = newStatus === 'Closed' ? '폐쇄' : '해제(운영재개)';
            
            if(!confirm(`정말로 구역 상태를 '${actionName}' 하시겠습니까?`)) return;

            try {
                const response = await fetch(`/zone/${zoneId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Status: newStatus })
                });
                if (response.ok) {
                    alert('상태가 변경되었습니다.');
                    loadZones();
                } else {
                    alert('변경 실패');
                }
            } catch (e) { alert('오류 발생'); }
        }

        // 4. 로그
        async function loadLogs() {
            const type = document.getElementById('logType').value;
            const tableHead = document.querySelector('#logTable thead');
            const tableBody = document.querySelector('#logTable tbody');
            
            // [수정] 헤더에 onclick="sortTable(인덱스)" 추가
            if (type === 'gate') {
                tableHead.innerHTML = `
                    <tr>
                        <th onclick="sortTable(0)">시간</th>
                        <th onclick="sortTable(1)">차량번호</th>
                        <th onclick="sortTable(2)">행동</th>
                        <th onclick="sortTable(3)">상태</th>
                        <th onclick="sortTable(4)">게이트</th>
                    </tr>`;
            } else {
                tableHead.innerHTML = `
                    <tr>
                        <th onclick="sortTable(0)">예약시간</th>
                        <th onclick="sortTable(1)">방문자</th>
                        <th onclick="sortTable(2)">구역</th>
                        <th onclick="sortTable(3)">상태</th>
                    </tr>`;
            }

            try {
                const response = await fetch(`/admin/logs?log_type=${type}`);
                const data = await response.json();
                
                tableBody.innerHTML = '';
                const logs = data.logs.slice(0, 20);

                logs.forEach(log => {
                    const tr = document.createElement('tr');
                    if (type === 'gate') {
                        // 시간 포맷 적용
                        const displayTime = formatTimeRaw(log.timestamp);
                        const actionClass = log.action === 'Entry' ? 'log-entry' : 'log-exit';
                        tr.innerHTML = `
                            <td>${displayTime}</td>
                            <td>${log.vehicleid}</td>
                            <td class="${actionClass}"><strong>${log.action}</strong></td>
                            <td>${log.status}</td>
                            <td>Gate ${log.gateid}</td>
                        `;
                    } else {
                        // 시간 포맷 적용
                        const displayTime = formatTimeRaw(log.reservestarttime);
                        tr.innerHTML = `
                            <td>${displayTime}</td>
                            <td>${log.visitorvehicleid}</td>
                            <td>${log.zonename || '-'}</td>
                            <td>${log.status}</td>
                        `;
                    }
                    tableBody.appendChild(tr);
                });
            } catch (e) { console.error(e); }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '/login';
        }

        // [신규] 테이블 정렬 함수 (클라이언트 사이드)
        function sortTable(n) {
            var table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
            table = document.getElementById("logTable");
            switching = true;
            dir = "asc"; // 기본은 오름차순

            while (switching) {
                switching = false;
                rows = table.rows;
                // 헤더(0번행) 제외하고 반복
                for (i = 1; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("TD")[n];
                    y = rows[i + 1].getElementsByTagName("TD")[n];
                    
                    // 내용 비교
                    var xContent = x.innerHTML.toLowerCase();
                    var yContent = y.innerHTML.toLowerCase();

                    if (dir == "asc") {
                        if (xContent > yContent) { shouldSwitch = true; break; }
                    } else if (dir == "desc") {
                        if (xContent < yContent) { shouldSwitch = true; break; }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount ++;
                } else {
                    if (switchcount == 0 && dir == "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }
    </script>
</body>
</html>
